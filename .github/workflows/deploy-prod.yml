name: Deploy Prod

on: workflow_dispatch

env:
  GC_REGION: us-central1
  AR_LOCATION: ${{ secrets.PROD_AR_LOCATION }}
  GC_SERVICE: ${{ secrets.PROD_GC_SERVICE }}

permissions:
  contents: read
  id-token: write

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v3"

      - name: Authenticate with service account JSON credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.PROD_KEY }}'

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: "Docker auth"
        run: |-
          gcloud auth configure-docker ${{ secrets.PROD_AR_REGION }}-docker.pkg.dev --quiet

      - name: Make envfile
        run: |
          touch .env
          echo "${{ secrets.PROD_ENV }}" > .env
          cat .env
        
      - name: "Build image"
        run: docker build -t ${{ secrets.PROD_AR_LOCATION }}:$GITHUB_SHA .

      - name: "Push image"
        run: docker push ${{ secrets.PROD_AR_LOCATION }}:$GITHUB_SHA
        
      - name: "Deploy"
        run: |-
          gcloud run deploy ${{ secrets.PROD_GC_SERVICE }} \
          --image ${{ secrets.PROD_AR_LOCATION }}:$GITHUB_SHA \
          --region $GC_REGION \
          --quiet